# Lattice Planner Configuration

lattice_planner:
  ros__parameters:
    # Reference path (relative to package)
    # reference_path_file: "slam_map_global"  # Will be resolved to package/config/reference_paths/
    # reference_path_file: "Spielberg_global"
    reference_path_file: "slamtoolbox_raceline"
    path_resolution: 0.1
    
    # Planning parameters (극한 최적화: 더 적은 샘플링)
    lateral_step: 0.4           # Lateral sampling step (m) - 극한 감소로 성능 향상
    max_lateral_offset: 1.0     # Maximum lateral offset (m) - 더 감소
    planning_horizon: 3.0       # Planning time horizon (s) - increased for longer paths
    dt: 0.2                     # Time step (s) - 증가로 더 적은 시간 샘플
    planning_frequency: 50.0    # Planning frequency (Hz) - increased for better responsiveness
    
    # Vehicle parameters
    max_velocity: 5.0          # Maximum velocity (m/s)
    wheelbase: 0.33             # Vehicle wheelbase (m)
    max_curvature: 1.0          # Maximum path curvature (1/m)
    
    # Cost weights (곡률 비용 제거)
    obstacle_cost_weight: 15.0  # 장애물 회피 우선순위 강화
    lateral_cost_weight: 3.0    # 레이스라인 선호도 약간 감소 (안정성 향상)
    curvature_cost_weight: 0.0  # 곡률 비용 완전 제거 - 차량 흔들림 방지
    longitudinal_cost_weight: 0.02  # Further reduced for speed prioritization
    
    # Safety parameters
    safety_margin: 0.15         # Safety margin around obstacles (m) - 축소
    collision_radius: 0.35      # Vehicle collision radius (m) - F1TENTH 차량 크기에 맞게 축소
    obstacle_detection_range: 8.0  # Obstacle detection range (m)
    
    # Occupancy grid settings - 장애물 감지 강화
    inline_occupancy_inflation_radius: 0.3   # 벽에서 30cm 안전거리
    occupancy_threshold: 75     # threshold 증가 (덜 민감한 장애물 감지)
    occupancy_grid_topic: "/map"  # 점유 격자 토픽
    
    # Additional cost weights
    obstacle_existence_weight: 3.0  # 장애물 존재 가중치 
    unknown_area_weight: 1.0        # 미지 영역 회피
    obstacle_distance_weight: 2.0   # 거리 기반 가중치