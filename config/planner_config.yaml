# Lattice Planner Configuration

lattice_planner:
  ros__parameters:
    # Reference path (relative to package)
    # reference_path_file: "slam_map_global"  # Will be resolved to package/config/reference_paths/
    # reference_path_file: "Spielberg_global"
    reference_path_file: "slamtoolbox_raceline"
    path_resolution: 0.1
    
    # Planning parameters (optimized for performance)
    lateral_step: 0.15           # Lateral sampling step (m)
    max_lateral_offset: 1.0     # Maximum lateral offset (m)
    planning_horizon: 1.3       # Planning time horizon (s)
    dt: 0.1                     # Time step (s)
    planning_frequency: 40.0    # Planning frequency (Hz)
    
    # Vehicle parameters
    max_velocity: 8.0          # Maximum velocity (m/s)
    wheelbase: 0.33             # Vehicle wheelbase (m)
    max_curvature: 1.0          # Maximum path curvature (1/m)
    
    # Cost weights (tuned for stable raceline following)
    obstacle_cost_weight: 10.0
    lateral_cost_weight: 5.0        # Maximum lateral cost weight for raceline preference
    curvature_cost_weight: 0.0      # Curvature cost removed to prevent oscillation
    longitudinal_cost_weight: 0.02  # Reduced for speed prioritization
    
    # Safety parameters
    safety_margin: 0.12         # Safety margin around obstacles (m)
    collision_radius: 0.35      # Vehicle collision radius (m)
    obstacle_detection_range: 8.0  # Obstacle detection range (m)
    
    # Occupancy grid settings
    inline_occupancy_inflation_radius: 0.25   # Safety distance from walls (m)
    occupancy_threshold: 85                    # Threshold for obstacle detection (higher = less sensitive)
    occupancy_grid_topic: "/updated_map"       # Map topic (remapped in launch file)
    
    # Obstacle detection control
    enable_lidar_obstacles_without_map: false  # Enable LiDAR obstacle detection even without map data
    
    # Additional cost weights
    obstacle_existence_weight: 2.0  # Obstacle existence weight
    unknown_area_weight: 0.8        # Unknown area avoidance weight
    obstacle_distance_weight: 1.5   # Distance-based obstacle weight
    
    # Path selection configuration for stability
    path_selection:
      # Basic commit parameters
      commit_min_progress: 1.0                    # Minimum progress distance (m)
      commit_min_time_sec: 0.8                    # Minimum commit time (s)
      commit_cost_improve_ratio: 0.1              # Cost improvement ratio
      commit_lateral_change_min: 0.05             # Minimum lateral change (m)
      
      # Obstacle situation commit parameters
      commit_obstacle_min_progress: 0.8           # Minimum progress distance in obstacle situations (m)
      commit_obstacle_min_time_sec: 1.2           # Minimum commit time in obstacle situations (s)
      commit_obstacle_improve_ratio: 0.2          # Cost improvement ratio in obstacle situations
      
      # Detour return settings
      detour_return_clear_frames_threshold: 15    # Clear frames required for return
      reference_offset_target: 0.0                # Target offset for return
      reference_offset_tolerance: 0.05            # Tolerance for reference path
      
      # Path length based commit
      path_length_commit_mode: true               # Enable path length based commit
      path_length: 2.0                           # Commit path length (m)
      obstacle_path_length_multiplier: 2.0        # Path length multiplier in obstacle situations
      
      # Hysteresis parameters for path stability
      cost_difference_threshold: 0.15             # Minimum cost difference for path change
      stability_frame_count: 3                    # Consecutive frames for stability
      lateral_change_penalty: 0.5                 # Penalty weight for lateral changes
